name: Disposable stock command-queue serialization (M16)

# TEST ONLY. Fresh ephemeral runner, official SHA-256-pinned Lidarr v3.1.6.5079 binary, empty config,
# one test-only plugin, a synthetic root folder with no audio. No production host, media, NAS or secrets.
on:
  pull_request:
    paths:
      - 'src/Crescendarr.Lidarr.QueueProbe/**'
      - 'tools/experiments/run_disposable_command_queue.py'
      - '.github/workflows/command-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve SHA-256-pinned upstream Lidarr stable runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lidarr-3.1.6.5079-linux-core-x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/Lidarr/Lidarr/releases/download/v3.1.6.5079/Lidarr.master.3.1.6.5079.linux-core-x64.tar.gz"
          printf '%s  %s\n' 'fed16c58f5de797be955e830a3a93994f020c1d8d60f5a6cb061d7647d45b8bc' "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/crescendarr-clean-host"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/crescendarr-clean-host"
          bin="$(dirname "$(find "${RUNNER_TEMP}/crescendarr-clean-host" -type f -name Lidarr.Core.dll -print -quit)")"
          test -f "$bin/Lidarr" && test -f "$bin/Lidarr.Common.dll"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Build NON-INSTALLABLE queue probe against the pinned host binaries
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Crescendarr.Lidarr.QueueProbe/Crescendarr.Lidarr.QueueProbe.csproj \
            -c Release --nologo --output "${RUNNER_TEMP}/crescendarr-queue-probe" \
            -p:CrescendarrDisposableHostBuild=true -p:LidarrBinDir="${{ steps.runtime.outputs.bin }}"
      - name: Registration, forward/reverse serialization, direct-scan bypass, dedupe, failure, SIGKILL restart
        shell: bash
        env:
          CI: "true"
        run: |
          python3 tools/experiments/run_disposable_command_queue.py \
            "${{ steps.runtime.outputs.bin }}" "${RUNNER_TEMP}/crescendarr-queue-probe/Lidarr.Plugin.Crescendarr.QueueProbe.dll" queue
      - name: Guard negative (plugin installed without opt-in refuses to run)
        shell: bash
        env:
          CI: "true"
        run: |
          python3 tools/experiments/run_disposable_command_queue.py \
            "${{ steps.runtime.outputs.bin }}" "${RUNNER_TEMP}/crescendarr-queue-probe/Lidarr.Plugin.Crescendarr.QueueProbe.dll" guard-negative
