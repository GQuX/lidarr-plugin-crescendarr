name: Native Lidarr safety characterization

# Loads ORIGINAL Lidarr v3.1.6.5079 source in an ephemeral runner.
# Only copies our test fixture into temporary checkout: no upstream repo writes.
# Includes mocked-source fixtures, a real disposable SQLite/synthetic-byte fixture,
# and two separate NUnit test processes exchanging a faulted SQLite snapshot.
# No user audio, real download clients, or production Lidarr database.
on:
  pull_request:
    paths:
      - 'tests/LidarrNative/**'
      - 'src/Crescendarr.Lidarr.Preflight/**'
      - '.github/workflows/native-lidarr-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-characterization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: crescendarr
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Lidarr/Lidarr
          # Commit underlying official stable v3.1.6.5079 tag, not a moving branch.
          ref: da7b4dfb1a9e7e1d6625c2dbc3fff96971ab26bd
          path: upstream-lidarr
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify pinned Lidarr source revision and stage original characterization tests
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C upstream-lidarr rev-parse HEAD)"
          test "$actual" = "da7b4dfb1a9e7e1d6625c2dbc3fff96971ab26bd"
          # Only our original characterization files are copied to this throwaway tree.
          cp crescendarr/tests/LidarrNative/Crescendarr*Fixture.cs \
            upstream-lidarr/src/NzbDrone.Core.Test/MediaFiles/
          # Build the SAME real, read-only preflight source that will be ABI-checked
          # against published binaries. This is not a Lidarr upstream modification.
          cp crescendarr/src/Crescendarr.Lidarr.Preflight/CrescendarrEditionPreflight.cs \
            upstream-lidarr/src/NzbDrone.Core.Test/MediaFiles/
          # Upstream Core.Test relies on a platform assembly loaded via Assembly.Load
          # in AutoMoqer. An isolated test-project-only build does not stage it.
          # Add the normal Linux platform project only in this throwaway checkout.
          dotnet add upstream-lidarr/src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj reference \
            upstream-lidarr/src/NzbDrone.Mono/Lidarr.Mono.csproj
          echo "Upstream source pinned at $actual, characterization fixture staged in ephemeral checkout" >> "$GITHUB_STEP_SUMMARY"
      # The 2026 NuGet advisory database flags a historical ImageSharp dependency
      # in this exact 2026 Lidarr source; its original TreatWarningsAsErrors blocks
      # characterization before compilation. Disabling audit applies ONLY to this
      # ephemeral historical-source test and does not change package versions.
      # Never interpret this as production dependency safety.
      - name: Run native importer, lyrics, completion, failure and disposable SQLite fixtures
        shell: bash
        run: |
          set -euo pipefail
          dotnet test upstream-lidarr/src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj \
            --configuration Debug \
            --filter '(FullyQualifiedName~Crescendarr&FullyQualifiedName!~CrescendarrProcessRestartFixture&FullyQualifiedName!~produce_sixth_file_interruption_checkpoint_for_new_process&FullyQualifiedName!~p0_crash_recovery)' \
            --logger 'console;verbosity=normal' \
            -p:EnableAnalyzers=false \
            -p:NuGetAudit=false
          echo "Native import/lyric/download tests PASSED with disposable SQLite and test-controlled byte moves" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare faulted stock SQLite in a separate test process
        shell: bash
        env:
          CRESCENDARR_M12_PHASE: prepare
          CRESCENDARR_M12_RESTART_ROOT: ${{ runner.temp }}/crescendarr-m12-restart-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          dotnet test upstream-lidarr/src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj \
            --configuration Debug --no-build \
            --filter 'FullyQualifiedName~produce_sixth_file_interruption_checkpoint_for_new_process' \
            --logger 'console;verbosity=normal' \
            -p:EnableAnalyzers=false -p:NuGetAudit=false
          test -f "$CRESCENDARR_M12_RESTART_ROOT/ready.marker"
          test -f "$CRESCENDARR_M12_RESTART_ROOT/interrupted-lidarr.db"
      - name: Reopen and repair interrupted SQLite in a new test process
        shell: bash
        env:
          CRESCENDARR_M12_PHASE: recover
          CRESCENDARR_M12_RESTART_ROOT: ${{ runner.temp }}/crescendarr-m12-restart-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f "$CRESCENDARR_M12_RESTART_ROOT/ready.marker"
          dotnet test upstream-lidarr/src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj \
            --configuration Debug --no-build \
            --filter 'FullyQualifiedName~CrescendarrProcessRestartFixture' \
            --logger 'console;verbosity=normal' \
            -p:EnableAnalyzers=false -p:NuGetAudit=false
          echo "Separate dotnet test processes reproduced and repaired a verified interrupted native SQLite/media snapshot. NOT a real Lidarr server restart." >> "$GITHUB_STEP_SUMMARY"
      # P0 issue #41: album-wide lyric detachment across REAL process termination. Every step below is
      # a separate `dotnet test` process. "killed" steps SIGKILL their own test host mid-operation; later
      # steps reopen the SQLite main file + WAL exactly as the kill left them. Disposable runner-temp only.
      - name: "P0 lane D1: publish all-album lyric manifest, SIGKILL mid-detach"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh detach-crash "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" killed
      - name: "P0 lane D2: new process, plugin absent, real stock tagged rescan"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh absent-scan "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 lane D3: malformed, stale, cross-album and conflicting observations require review"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh negative "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass 'FullyQualifiedName~p0_crash_recovery_negative'
      - name: "P0 lane D4: new process recovers from fresh host IDs, physical hashes and backups"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh recover "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 lane D5: second restart replays as a no-op, including a stock rescan"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh replay "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 lane D6: RequiresReview stays sticky across a restart"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh review-replay "$RUNNER_TEMP/crescendarr-p0-detach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 lane R1: publish manifest, SIGKILL mid-detach"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh detach-crash "$RUNNER_TEMP/crescendarr-p0-reattach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" killed
      - name: "P0 lane R2: new process starts reattachment, SIGKILL mid-reattach"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh recover-crash "$RUNNER_TEMP/crescendarr-p0-reattach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" killed
      - name: "P0 lane R3: new process, plugin absent stock rescan, then recovery"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh absent-scan-recover "$RUNNER_TEMP/crescendarr-p0-reattach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 lane R4: second restart replays as a no-op, including a stock rescan"
        shell: bash
        run: bash crescendarr/tests/LidarrNative/p0-crash-phase.sh replay "$RUNNER_TEMP/crescendarr-p0-reattach-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pass
      - name: "P0 evidence: journals and kill points"
        if: always()
        shell: bash
        run: |
          for root in "$RUNNER_TEMP"/crescendarr-p0-*; do
            [ -d "$root" ] || continue
            echo "===== $root"
            for f in "$root"/kill-*.evidence "$root"/journal.log "$root"/neg-*/journal.log; do
              [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
            done
            ls -la "$root" "$root"/crashed-db-* 2>/dev/null || true
          done
