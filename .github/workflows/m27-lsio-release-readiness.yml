name: M27 release readiness (LinuxServer.io Lidarr, real SABnzbd, kernel CIFS, real plugin installer)

# Release-readiness pass for the AUDIT-ONLY candidate. Disposable runner only: the LinuxServer.io Lidarr 3.1.6.5079-ls49
# container (digest recorded), persistent /config, REAL SABnzbd 5.1.3 fed by a localhost NNTP fixture, a kernel-mounted
# SMB/CIFS library from a loopback Samba, stock Completed Download Handling ON. The plugin is installed, upgraded, rolled
# back and uninstalled by Lidarr's own installer against a LOCAL mock of api.github.com (throwaway CA trusted only in the
# container). Nothing is published: no tag, no release, no real GitHub release API write.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/audit-scan/**'
      - 'tools/package_lidarr_native.py'
      - 'tools/experiments/run_disposable_m27.py'
      - 'tools/experiments/mock_github.py'
      - 'tools/experiments/cifs_fixture.py'
      - 'tools/experiments/nntp_fixture.py'
      - '.github/workflows/m27-lsio-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 3.1.6.5079-ls49, pinned by the digest recorded in run 45261466845 (tags can be re-pushed; digests cannot).
  LIDARR_IMAGE: lscr.io/linuxserver/lidarr@sha256:8fb40ada166dd1880cb1b166df5bcbb081107523f20ab60df05c313e2052a467
  SABNZBD_VERSION: '5.1.3'
  SABNZBD_SHA256: '12a01e30ce166297a375ffc3a761f98bf7d93260e040391497f643f8a3525fed'

jobs:
  lsio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Pull the LinuxServer.io Lidarr image and record its exact identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do docker pull "$LIDARR_IMAGE" >/dev/null && break; echo "pull attempt $attempt failed (registry rate limit?)"; sleep $((attempt * 30)); done
          docker image inspect "$LIDARR_IMAGE" >/dev/null
          {
            echo "image: $LIDARR_IMAGE"
            echo "digest: $(docker image inspect --format '{{index .RepoDigests 0}}' "$LIDARR_IMAGE")"
            echo "label build_version: $(docker image inspect --format '{{index .Config.Labels "build_version"}}' "$LIDARR_IMAGE")"
            echo "label version: $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$LIDARR_IMAGE")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrieve the SHA-256-pinned upstream Lidarr runtime (setup-only seeding of the synthetic library)
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lidarr.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/Lidarr/Lidarr/releases/download/v3.1.6.5079/Lidarr.master.3.1.6.5079.linux-core-x64.tar.gz"
          printf '%s  %s\n' 'fed16c58f5de797be955e830a3a93994f020c1d8d60f5a6cb061d7647d45b8bc' "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/lidarr"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/lidarr"
          echo "bin=$(dirname "$(find "${RUNNER_TEMP}/lidarr" -type f -name Lidarr.Core.dll -print -quit)")" >> "$GITHUB_OUTPUT"
      - name: Install Samba and the kernel CIFS client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba cifs-utils par2 unrar >/dev/null
          sudo systemctl stop smbd nmbd samba-ad-dc 2>/dev/null || true
          sudo systemctl disable smbd nmbd 2>/dev/null || true
          if ! sudo modprobe cifs; then
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null || true
            sudo modprobe cifs
          fi
          { echo "kernel: $(uname -r)"; echo "smbd: $(smbd --version)"; echo "cifs.ko: $(modinfo -F version cifs)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrieve and install the SHA-256-pinned real SABnzbd release (disposable venv)
        id: sab
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/SABnzbd-${SABNZBD_VERSION}-src.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/sabnzbd/sabnzbd/releases/download/${SABNZBD_VERSION}/SABnzbd-${SABNZBD_VERSION}-src.tar.gz"
          printf '%s  %s\n' "${SABNZBD_SHA256}" "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/sab"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/sab"
          dir="${RUNNER_TEMP}/sab/SABnzbd-${SABNZBD_VERSION}"
          python3 -m venv "${RUNNER_TEMP}/sab-venv"
          "${RUNNER_TEMP}/sab-venv/bin/pip" install --quiet --disable-pip-version-check -r "$dir/requirements.txt"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "python=${RUNNER_TEMP}/sab-venv/bin/python" >> "$GITHUB_OUTPUT"
      - name: Build, scan and package the audit-only candidate exactly as the M25/M26 release pipeline does
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          for channel in audit-beta.1 audit-beta.2; do
            rm -rf src/Crescendarr.Lidarr.AuditPlugin/bin src/Crescendarr.Lidarr.AuditPlugin/obj
            dotnet build src/Crescendarr.Lidarr.AuditPlugin/Crescendarr.Lidarr.AuditPlugin.csproj -c Release --nologo --output "${RUNNER_TEMP}/audit-$channel" \
              -p:LidarrBinDir="${{ steps.runtime.outputs.bin }}" -p:CrescendarrCommit="$commit" -p:CrescendarrChannel="$channel"
          done
          dotnet build tools/audit-scan/Crescendarr.AuditScan.csproj -c Release --nologo --output "${RUNNER_TEMP}/scan"
          mkdir -p "${RUNNER_TEMP}/candidate"
          for channel in audit-beta.1 audit-beta.2; do
            dotnet "${RUNNER_TEMP}/scan/Crescendarr.AuditScan.dll" "${RUNNER_TEMP}/audit-$channel/Lidarr.Plugin.Crescendarr.dll" | grep -E 'AUDIT_SCAN'
            python3 tools/package_lidarr_native.py "${RUNNER_TEMP}/audit-$channel/Lidarr.Plugin.Crescendarr.dll" "0.25.0-$channel" "${RUNNER_TEMP}/candidate"
          done
          sha256sum "${RUNNER_TEMP}/audit-audit-beta.1/Lidarr.Plugin.Crescendarr.dll" > "${RUNNER_TEMP}/candidate/audit-scan.dll.sha256"
          ( cd "${RUNNER_TEMP}/candidate" && sha256sum *.zip ) | tee -a "$GITHUB_STEP_SUMMARY"
          dotnet build tools/experiments/m17-seeder/Crescendarr.M17FixtureSeeder.csproj -c Release --nologo --output "${RUNNER_TEMP}/seeder" \
            -p:CrescendarrDisposableHostBuild=true -p:LidarrBinDir="${{ steps.runtime.outputs.bin }}"
      - name: LinuxServer.io container lane
        shell: bash
        run: |
          python3 tools/experiments/run_disposable_m27.py "${{ steps.runtime.outputs.bin }}" \
            "${RUNNER_TEMP}/seeder/Lidarr.Plugin.CrescendarrFixtureSeeder.dll" "${RUNNER_TEMP}/candidate" \
            "${{ steps.sab.outputs.dir }}" "${{ steps.sab.outputs.python }}" "$LIDARR_IMAGE"
      - name: Always remove the container, unmount and stop leftover services
        if: always()
        shell: bash
        run: |
          docker rm -f crescendarr-m27-lidarr >/dev/null 2>&1 || true
          for m in $(findmnt -rn -t cifs -o TARGET); do sudo umount -l "$m" || true; done
          sudo pkill -9 smbd || true
          sudo pkill -f mock_github.py || true
          sudo chmod -R a+rX "${RUNNER_TEMP}"/crescendarr-m27-* 2>/dev/null || true
      - name: Upload redacted evidence (no DB copies; they hold the ephemeral SAB API key)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m27-lsio-evidence
          path: |
            ${{ runner.temp }}/m27-lsio-evidence.txt
            ${{ runner.temp }}/crescendarr-m27-*/mock-github/requests.log
            ${{ runner.temp }}/crescendarr-m27-*/mock-github/releases.json
            ${{ runner.temp }}/crescendarr-m27-*/config/crescendarr-audit/**
            ${{ runner.temp }}/candidate/*.sha256
          retention-days: 7
