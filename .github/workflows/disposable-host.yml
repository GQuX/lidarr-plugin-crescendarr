name: Disposable Lidarr DI smoke test

# WARNING: Test-only probe blocks imports; this workflow never uses a live host.
# Fresh ephemeral runner, clean config/database, no production media mounts or secrets.
on:
  pull_request:
    paths:
      - 'src/Crescendarr.Lidarr.Probe/**'
      - 'tools/experiments/**'
      - '.github/workflows/disposable-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-lidarr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve SHA-256-pinned upstream Lidarr stable runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lidarr-3.1.6.5079-linux-core-x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/Lidarr/Lidarr/releases/download/v3.1.6.5079/Lidarr.master.3.1.6.5079.linux-core-x64.tar.gz"
          printf '%s  %s\n' 'fed16c58f5de797be955e830a3a93994f020c1d8d60f5a6cb061d7647d45b8bc' "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/crescendarr-clean-host"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/crescendarr-clean-host"
          bin="$(dirname "$(find "${RUNNER_TEMP}/crescendarr-clean-host" -type f -name Lidarr.Core.dll -print -quit)")"
          if [[ -z "$bin" || ! -f "$bin/Lidarr" || ! -f "$bin/Lidarr.Common.dll" ]]; then
            echo "Expected official Lidarr binary layout is missing" >&2
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "Verified upstream Lidarr 3.1.6.5079 release archive SHA-256" >> "$GITHUB_STEP_SUMMARY"
      - name: Build NON-INSTALLABLE probe using pinned host references
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Crescendarr.Lidarr.Probe/Crescendarr.Lidarr.Probe.csproj \
            -c Release --nologo \
            --output "${RUNNER_TEMP}/crescendarr-compiled-probe" \
            -p:CrescendarrDisposableHostBuild=true \
            -p:LidarrBinDir="${{ steps.runtime.outputs.bin }}"
      - name: Start fresh disposable Lidarr host, test binding, and stop
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          for mode in baseline guard-negative probe; do
            echo "Running fresh disposable Lidarr host mode: $mode"
            python3 tools/experiments/run_disposable_lidarr.py \
              "${{ steps.runtime.outputs.bin }}" \
              "${RUNNER_TEMP}/crescendarr-compiled-probe/Lidarr.Plugin.Crescendarr.Probe.dll" \
              "$mode"
          done
          echo "Baseline, missing opt-in, and synthetic interception passed in isolated configs." >> "$GITHUB_STEP_SUMMARY"
