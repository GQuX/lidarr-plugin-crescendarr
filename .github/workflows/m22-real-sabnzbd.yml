name: M22 real SABnzbd through stock Lidarr (disposable)

# M22 (#56) EXPERIMENTAL, TEST ONLY. A REAL SABnzbd process (pinned 5.1.3 source release, SHA-256 verified, its own
# pinned requirements.txt) downloads synthetic NZBs from a CI-only localhost NNTP fixture. Official SHA-256-pinned
# Lidarr v3.1.6.5079 with its stock Sabnzbd client, CDH OFF. No public Usenet, real NZBs, credentials, SMB or NAS.
# Network beyond localhost is used only to fetch the pinned Lidarr and SABnzbd releases and their Python wheels.
on:
  pull_request:
    paths:
      - 'src/Crescendarr.Lidarr.Plugin/**'
      - 'src/Crescendarr.Core/**'
      - 'tools/experiments/**'
      - '.github/workflows/m22-real-sabnzbd.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SABNZBD_VERSION: '5.1.3'
  SABNZBD_SHA256: '12a01e30ce166297a375ffc3a761f98bf7d93260e040391497f643f8a3525fed'

jobs:
  real-sabnzbd:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [sab-real-happy, sab-real-failed-retry, sab-real-restarts, sab-real-paths]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve SHA-256-pinned upstream Lidarr stable runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lidarr-3.1.6.5079-linux-core-x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/Lidarr/Lidarr/releases/download/v3.1.6.5079/Lidarr.master.3.1.6.5079.linux-core-x64.tar.gz"
          printf '%s  %s\n' 'fed16c58f5de797be955e830a3a93994f020c1d8d60f5a6cb061d7647d45b8bc' "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/crescendarr-clean-host"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/crescendarr-clean-host"
          bin="$(dirname "$(find "${RUNNER_TEMP}/crescendarr-clean-host" -type f -name Lidarr.Core.dll -print -quit)")"
          test -f "$bin/Lidarr"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Retrieve and install the SHA-256-pinned real SABnzbd release (disposable venv)
        id: sab
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/SABnzbd-${SABNZBD_VERSION}-src.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" \
            "https://github.com/sabnzbd/sabnzbd/releases/download/${SABNZBD_VERSION}/SABnzbd-${SABNZBD_VERSION}-src.tar.gz"
          printf '%s  %s\n' "${SABNZBD_SHA256}" "$archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/sab"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/sab"
          dir="${RUNNER_TEMP}/sab/SABnzbd-${SABNZBD_VERSION}"
          # SABnzbd refuses to download without par2 and unrar ("Essential modules are missing"). Ubuntu 24.04 archive packages.
          sudo apt-get update -qq
          sudo apt-get install -y -qq par2 unrar >/dev/null
          { echo "par2: $(par2 --version 2>&1 | head -1)"; echo "unrar: $(unrar 2>&1 | sed -n 2p)"; dpkg-query -W par2 unrar; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m venv "${RUNNER_TEMP}/sab-venv"
          "${RUNNER_TEMP}/sab-venv/bin/pip" install --quiet --disable-pip-version-check -r "$dir/requirements.txt"
          "${RUNNER_TEMP}/sab-venv/bin/python" -c "import sabctools, sys; print('sabctools', sabctools.__version__, 'python', sys.version.split()[0])" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "python=${RUNNER_TEMP}/sab-venv/bin/python" >> "$GITHUB_OUTPUT"
      - name: Build the ONE experimental Crescendarr plugin and the separate test-harness seeder
        shell: bash
        run: |
          set -euo pipefail
          for project in src/Crescendarr.Lidarr.Plugin/Crescendarr.Lidarr.Plugin.csproj tools/experiments/m17-seeder/Crescendarr.M17FixtureSeeder.csproj; do
            name="$(basename "$project" .csproj)"
            dotnet build "$project" -c Release --nologo --output "${RUNNER_TEMP}/out-$name" \
              -p:CrescendarrDisposableHostBuild=true -p:LidarrBinDir="${{ steps.runtime.outputs.bin }}"
          done
      - name: Real SABnzbd lane (${{ matrix.scenario }})
        shell: bash
        run: |
          python3 tools/experiments/run_disposable_m22.py "${{ steps.runtime.outputs.bin }}" \
            "${RUNNER_TEMP}/out-Crescendarr.Lidarr.Plugin/Lidarr.Plugin.Crescendarr.dll" \
            "${RUNNER_TEMP}/out-Crescendarr.M17FixtureSeeder/Lidarr.Plugin.CrescendarrFixtureSeeder.dll" \
            "${{ steps.sab.outputs.dir }}" "${{ steps.sab.outputs.python }}" "${{ matrix.scenario }}"
      - name: Upload redacted evidence (no DB copies; they hold the ephemeral SAB API key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m22-${{ matrix.scenario }}-evidence
          path: |
            ${{ runner.temp }}/m22-*-evidence.txt
            ${{ runner.temp }}/crescendarr-m22-*/sabnzbd.log
            ${{ runner.temp }}/crescendarr-m22-*/crescendarr/**/*.json
            ${{ runner.temp }}/crescendarr-m22-*/seed.json
          retention-days: 7
