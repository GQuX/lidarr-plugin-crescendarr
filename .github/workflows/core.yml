name: Pure planner specs
on:
  push:
    paths:
      - 'src/Crescendarr.Core/**'
      - 'tests/Crescendarr.Core.Spec/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/core.yml'
      - 'deploy/portainer/**'
      - 'tools/**'
  pull_request:

jobs:
  pure-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Run no-NuGet executable core specifications
        run: dotnet run --project tests/Crescendarr.Core.Spec/Crescendarr.Core.Spec.csproj --configuration Release

  portainer-compose-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install developer-only YAML parser
        run: python -m pip install pyyaml==6.0.3
      - name: Check isolated Portainer example
        run: python tools/check_disposable_compose.py
      - name: Exercise reject-unsafe regressions
        run: python -m unittest discover -s tools/tests -v
      - name: Existing static foundation check
        run: python tools/validate-source.py
